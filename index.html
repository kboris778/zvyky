<style>
:root{--bg:#f2f2f7;--card:#fff;--card2:#f6f6f9;--text:#111114;--muted:#8a8a92;--line:rgba(0,0,0,.08);--accent:#5b5bf0;--empty:#e7e7ee;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--card2:#2a2a2d;--text:#f4f4f6;--muted:#8e8e96;--line:rgba(255,255,255,.1);--accent:#7d7dff;--empty:#2b2b30;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
.view{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 2px 14px}
.hdr h1{font-size:32px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.5px}
.hdr .sm{color:var(--muted);font-size:14px;font-weight:600;margin-bottom:2px}
.hdr .sm::first-letter{text-transform:uppercase}
.fab{width:40px;height:40px;border-radius:20px;background:var(--accent);color:#fff;font-size:26px;line-height:40px;text-align:center;font-weight:500;box-shadow:0 4px 12px rgba(91,91,240,.35)}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:22px 4px 8px}
.strip{display:flex;justify-content:space-between;gap:4px;margin-bottom:12px}
.dpill{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:14px}
.dpill.sel{background:var(--card);box-shadow:var(--shadow)}
.dpill .dw{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.dn{font-size:13px;font-weight:700}
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .in{position:relative;z-index:1;display:flex;align-items:center;justify-content:center}
.summary{display:flex;align-items:center;gap:16px}
.summary .big{font-size:22px;font-weight:800}
.summary .t{color:var(--muted);font-size:14px}
.hab{display:flex;align-items:center;gap:12px;padding:12px}
.hab .btn{flex:none;border-radius:50%;transition:transform .12s}
.hab .btn:active{transform:scale(.92)}
.hab .em{font-size:26px}
.hab .info{flex:1;min-width:0;cursor:pointer}
.hab .nm{font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hab.done .nm{color:var(--muted)}
.hab .sub{font-size:13px;color:var(--muted);margin-top:2px}
.hab .sub b{color:var(--c);font-weight:700}
.badge{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:10px;background:var(--c);color:#fff;font-size:12px;font-weight:800;line-height:20px;text-align:center;border:2px solid var(--card);z-index:2}
.pm{display:flex;gap:6px}
.pm button{width:36px;height:36px;border-radius:12px;background:var(--card2);font-size:20px;font-weight:600;color:var(--c)}
.chev{font-size:26px;color:var(--muted);padding:0 4px}
.banner{background:linear-gradient(135deg,#ff9f0a22,#ff9f0a10);border:1px solid #ff9f0a55;border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.note{width:100%;min-height:84px;border:0;border-radius:14px;background:var(--card);box-shadow:var(--shadow);padding:12px;resize:vertical;outline:none}

<body>
<div id="app"></div>
<input type="file" id="file" accept="application/json,.json,text/plain" hidden>
<script>
'use strict';
const KEY='navyky.v1';
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dow=d=>(d.getDay()+6)%7+1;
const weekStart=d=>addDays(d,-(dow(d)-1));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const WD=['Po','Ut','St','Št','Pi','So','Ne'];
const MS=['jan','feb','mar','apr','máj','jún','júl','aug','sep','okt','nov','dec'];
const plD=n=>n===1?'deň':(n>=2&&n<=4?'dni':'dní');
const plW=n=>n===1?'týždeň':(n>=2&&n<=4?'týždne':'týždňov');
const pct=x=>x==null?'–':Math.round(x*100)+' %';
const EMOJIS='💧 🏃 🚶 💪 🧘 📖 📚 ✍️ 🥗 🍎 🥛 ☕ 😴 🛏️ 🦷 💊 🧴 🚿 📵 🚭 🍺 🍬 💰 📈 🎯 💼 🧠 🗣️ 🇬🇧 🎸 🎨 🧹 🌱 ☀️ 🙏 ❤️ 🚴 🏊 ⚽ 🏋️ 🐕 ✂️'.split(' ');
const COLORS=['#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#30b0ff','#007aff','#5b5bf0','#af52de','#ff2d55','#a2845e','#8e8e93'];

let S=load();
let ui={tab:'today',day:dkey(today()),detail:null,cal:null,edit:null,paste:false};
let lastToday=dkey(today());

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.habits))return norm(s)}catch(e){}return null}
function norm(s){s.log=s.log||{};s.notes=s.notes||{};s.habits.forEach((h,i)=>{h.target=Math.max(1,+h.target||1);h.type=h.type||'check';h.schedule=h.schedule||{kind:'daily'};h.schedule.days=h.schedule.days||[1,2,3,4,5];h.schedule.times=h.schedule.times||3;h.color=h.color||'#5b5bf0';h.emoji=h.emoji||'✅';h.createdAt=h.createdAt||dkey(today());});return s}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Nepodarilo sa uložiť: '+e.message)}}
const byId=id=>S.habits.find(h=>h.id===id);
const active=()=>S.habits.filter(h=>!h.archived);

const val=(h,k)=>(S.log[k]&&S.log[k][h.id])||0;
function setVal(h,k,v){v=Math.max(0,Math.min(v,9999));if(!S.log[k])S.log[k]={};if(v)S.log[k][h.id]=v;else delete S.log[k][h.id];if(!Object.keys(S.log[k]).length)delete S.log[k];save()}
const isDone=(h,k)=>val(h,k)>=h.target;
const scheduled=(h,d)=>h.schedule.kind!=='weekdays'||h.schedule.days.includes(dow(d));
function startOf(h){let s=h.createdAt;for(const k in S.log)if(k<s&&S.log[k][h.id])s=k;return parse(s)}
function weekCount(h,d){const w=weekStart(d),t=today();let c=0;for(let i=0;i<7;i++){const x=addDays(w,i);if(x>t)break;if(isDone(h,dkey(x)))c++}return c}
function schedLabel(h){const s=h.schedule;if(s.kind==='daily')return'Každý deň';if(s.kind==='perweek')return s.times+'× týždenne';const d=[...s.days].sort();if(d.join()==='1,2,3,4,5')return'Pracovné dni';if(d.join()==='6,7')return'Víkendy';return d.map(x=>WD[x-1]).join(', ')}

function streaks(h){
  const t=today(),st=startOf(h);
  if(h.schedule.kind==='perweek'){
    const weeks=[];const tw=weekStart(t);
    for(let w=weekStart(st);w<=tw;w=addDays(w,7))weeks.push(weekCount(h,w)>=h.schedule.times);
    let run=0,best=0;weeks.forEach(ok=>{run=ok?run+1:0;best=Math.max(best,run)});
    let i=weeks.length-1;if(i>=0&&!weeks[i])i--;let cur=0;while(i>=0&&weeks[i]){cur++;i--}
    return{cur,best,w:true};
  }
  let run=0,best=0;
  for(let d=new Date(st);d<=t;d=addDays(d,1)){
    const done=isDone(h,dkey(d));
    if(!scheduled(h,d)&&!done)continue;
    if(done){run++;best=Math.max(best,run)}else if(+d!==+t)run=0;
  }
  return{cur:run,best,w:false};
}
const stTxt=(n,w)=>n+' '+(w?plW(n):plD(n));
function rate(h,days){
  const t=today();let from=addDays(t,-(days-1));const st=startOf(h);if(st>from)from=st;
  if(h.schedule.kind==='perweek'){
    let c=0,n=0;for(let d=new Date(from);d<=t;d=addDays(d,1)){n++;if(isDone(h,dkey(d)))c++}
    const exp=Math.max(1,Math.round(h.schedule.times*n/7));return Math.min(1,c/exp);
  }
  let s=0,c=0;
  for(let d=new Date(from);d<=t;d=addDays(d,1)){
    if(!scheduled(h,d))continue;const done=isDone(h,dkey(d));
    if(+d===+t&&!done)continue;s++;if(done)c++;
  }
  return s?c/s:null;
}
function totalDone(h){let c=0;for(const k in S.log)if((S.log[k][h.id]||0)>=h.target)c++;return c}
function dayRate(d){
  const k=dkey(d);let s=0,n=0;
  for(const h of active()){if(!scheduled(h,d)||startOf(h)>d)continue;n++;s+=hFrac(h,d)}
  return n?s/n:null;
}
function hFrac(h,d){const k=dkey(d);if(h.schedule.kind==='perweek')return(isDone(h,k)||weekCount(h,d)>=h.schedule.times)?1:0;return Math.min(val(h,k)/h.target,1)}
const hOk=(h,d)=>hFrac(h,d)>=1;
function weekRate(ws){
  const t=today();let s=0,n=0;
  for(const h of active()){
    const st=startOf(h);if(st>addDays(ws,6))continue;
    if(h.schedule.kind==='perweek'){n++;s+=Math.min(weekCount(h,ws)/h.schedule.times,1);continue}
    let sc=0,c=0;for(let i=0;i<7;i++){const d=addDays(ws,i);if(d>t||d<st||!scheduled(h,d))continue;const done=isDone(h,dkey(d));if(+d===+t&&!done)continue;sc++;if(done)c++}
    if(sc){n++;s+=c/sc}
  }
  return n?s/n:null;
}

function ring(frac,size,color,inner,fill){
  const sw=size>40?5:3.5,r=(size-sw)/2,c=2*Math.PI*r,f=Math.max(0,Math.min(1,frac||0));
  return `<span class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="${fill?color:'none'}" stroke="${fill?color:'var(--empty)'}" stroke-width="${sw}"/>${!fill&&f>0?`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*f} ${c}"/>`:''}</svg><span class="in">${inner||''}</span></span>`;
}

/* ---------- views ---------- */
function onboarding(){
  return `<div class="ob"><div class="logo">✓</div><h1>Návyky</h1><p>Tvoj osobný tracker zvykov a progresu. Všetko zostáva len v tvojom telefóne.</p>
  <ul><li><span>👆</span><div><b>Jedno ťuknutie</b><small>Splnené jedným ťuknutím, pri počtoch tlačidlá + a −.</small></div></li>
  <li><span>🔥</span><div><b>Série a štatistiky</b><small>Aktuálna a najlepšia séria, úspešnosť, grafy po týždňoch.</small></div></li>
  <li><span>🟩</span><div><b>Ročná mapa</b><small>Každý deň ako políčko, ako na GitHube.</small></div></li>
  <li><span>📅</span><div><b>Flexibilný plán</b><small>Každý deň, vybrané dni alebo X× týždenne.</small></div></li></ul>
  <button class="pbtn" data-a="seed">Začať s ukážkovými zvykmi</button><div style="height:10px"></div>
  <button class="sbtn" data-a="fresh">Začať od nuly</button>
  <div class="hint" style="text-align:center">Tip: v Safari daj Zdieľať → „Pridať na plochu“ a appka sa otvorí na celú obrazovku.</div></div>`;
}
function tabbar(){
  const t=(id,i,l)=>`<button class="tab ${ui.tab===id?'on':''}" data-a="tab" data-tab="${id}"><span class="i">${i}</span>${l}</button>`;
  return `<nav class="tabbar">${t('today','✅','Dnes')}${t('stats','📊','Prehľad')}${t('habits','⚙️','Zvyky')}</nav>`;
}
function card(h,k){
  const v=val(h,k),done=hOk(h,parse(k)),frac=Math.min(v/h.target,1),st=streaks(h);
  const sub=[];
  if(st.cur)sub.push(`<b>🔥 ${stTxt(st.cur,st.w)}</b>`);
  if(h.type==='count')sub.push(`${v}/${h.target} ${esc(h.unit||'')}`);
  if(h.schedule.kind==='perweek')sub.push(`${weekCount(h,parse(k))}/${h.schedule.times} tento týždeň`);
  else if(h.type!=='count')sub.push(schedLabel(h));
  if(h.reminder)sub.push('⏰ '+esc(h.reminder));
  return `<div class="card hab ${done?'done':''}" style="--c:${h.color}">
   <button class="btn" data-a="tap" data-id="${h.id}" aria-label="Splniť ${esc(h.name)}">${ring(frac,58,h.color,`<span class="em">${h.emoji}</span>`,done)}${done?'<span class="badge">✓</span>':''}</button>
   <div class="info" data-a="open" data-id="${h.id}"><div class="nm">${esc(h.name)}</div><div class="sub">${sub.join(' · ')}</div></div>
   ${h.type==='count'?`<div class="pm"><button data-a="dec" data-id="${h.id}" aria-label="Mínus">−</button><button data-a="inc" data-id="${h.id}" aria-label="Plus">+</button></div>`:`<button class="chev" data-a="open" data-id="${h.id}">›</button>`}</div>`;
}
function vToday(){
  const t=today(),k=ui.day,sel=parse(k),isT=k===dkey(t);
  let strip='';
  for(let i=6;i>=0;i--){const d=addDays(t,-i),dk=dkey(d),r=dayRate(d);strip+=`<button class="dpill ${dk===k?'sel':''}" data-a="day" data-d="${dk}"><span class="dw">${WD[dow(d)-1]}</span>${ring(r||0,36,'var(--accent)',`<span class="dn">${d.getDate()}</span>`)}</button>`}
  const act=active();
  const title=isT?'Dnes':(+sel===+addDays(t,-1)?'Včera':sel.toLocaleDateString('sk-SK',{weekday:'long'}));
  const dateTxt=sel.toLocaleDateString('sk-SK',{weekday:isT?'long':undefined,day:'numeric',month:'long'});
  let h=`<div class="hdr"><div><div class="sm">${dateTxt}</div><h1>${title}</h1></div><button class="fab" data-a="new" aria-label="Nový zvyk">+</button></div><div class="strip">${strip}</div>`;
  if(!act.length)return h+`<div class="card empty"><div class="e">🌱</div><p><b>Zatiaľ nemáš žiadne zvyky.</b><br>Začni jedným malým zvykom, napríklad pohár vody ráno.</p><button class="pbtn" data-a="new">Pridať prvý zvyk</button></div>`;
  const sch=act.filter(x=>scheduled(x,sel)),other=act.filter(x=>!scheduled(x,sel));
    const doneN=sch.filter(x=>hOk(x,sel)).length;
  const r=dayRate(sel)||0;
  h+=`<div class="card summary">${ring(r,64,'var(--accent)',`<b style="font-size:15px">${Math.round(r*100)}%</b>`)}<div><div class="big">${doneN} z ${sch.length} splnených</div><div class="t">${doneN===sch.length&&sch.length?'Super, dnešok máš za sebou! 🎉':motiv(r)}</div></div></div>`;
  if(isT){
    const now=new Date(),nt=pad(now.getHours())+':'+pad(now.getMinutes());
    const due=sch.filter(x=>x.reminder&&x.reminder<=nt&&!hOk(x,sel));
    if(due.length)h+=`<div class="banner">⏰ Čaká na teba: <b>${due.map(x=>x.emoji+' '+esc(x.name)).join(', ')}</b></div>`;
  }
  h+=sch.map(x=>card(x,k)).join('');
  if(other.length)h+=`<div class="sec">Dnes nie je v pláne</div>`+other.map(x=>card(x,k)).join('');
  h+=`<div class="sec">Poznámka k dňu</div><textarea class="note" id="note" placeholder="Ako sa ti dnes darilo? Čo pomohlo, čo nie…">${esc(S.notes[k]||'')}</textarea>`;
  return h;
}
function motiv(r){if(r===0)return'Začni tým najmenším. Stačí jedno ťuknutie.';if(r<.5)return'Dobrý začiatok, pokračuj!';if(r<1)return'Už len kúsok do cieľa 💪';return''}

function heat(fn,color){
  const t=today(),start=addDays(weekStart(t),-52*7);let cells='',months='';
  for(let w=0;w<53;w++){
    const ws=addDays(start,w*7);let lab='';
    for(let i=0;i<7;i++){const d=addDays(ws,i);if(d.getDate()===1)lab=MS[d.getMonth()]}
    if(w===0)lab=lab||MS[ws.getMonth()];
    months+=`<span>${lab}</span>`;
    for(let i=0;i<7;i++){
      const d=addDays(ws,i);
      if(d>t){cells+='<i class="f"></i>';continue}
      const f=fn(d);const tt=+d===+t?' t':'';
      cells+=f>0?`<i class="${tt}" style="background:${color};opacity:${(.3+.7*Math.min(f,1)).toFixed(2)}" title="${dkey(d)}"></i>`:`<i class="${tt}" title="${dkey(d)}"></i>`;
    }
  }
  return `<div class="hm-scroll"><div class="hm-m">${months}</div><div class="hm">${cells}</div></div><div class="legend">menej <i style="background:var(--empty)"></i><i style="background:${color};opacity:.4"></i><i style="background:${color};opacity:.7"></i><i style="background:${color}"></i> viac</div>`;
}

function render(){
  const app=$('#app');const keep={};document.querySelectorAll('.panel-body').forEach(p=>keep[p.dataset.p]=p.scrollTop);
  if(!S){app.innerHTML=onboarding();return}
  let html=`<div class="view">${ui.tab==='today'?vToday():ui.tab==='stats'?vStats():vHabits()}</div>${tabbar()}`;
  if(ui.detail)html+=vDetail();
  if(ui.edit)html+=vEdit();
  app.innerHTML=html;
  document.body.classList.toggle('lock',!!(ui.detail||ui.edit));
  document.querySelectorAll('.panel-body').forEach(p=>{if(keep[p.dataset.p]!=null)p.scrollTop=keep[p.dataset.p]});
  document.querySelectorAll('.hm-scroll').forEach(e=>e.scrollLeft=e.scrollWidth);
}

function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function backup(){return JSON.stringify({app:'navyky',exportedAt:new Date().toISOString(),...S},null,1)}
function restore(txt){
  let d;try{d=JSON.parse(txt)}catch(e){toast('Neplatný súbor zálohy');return}
  if(!d||!Array.isArray(d.habits)){toast('V zálohe nie sú žiadne zvyky');return}

  delete d.app;delete d.exportedAt;S=norm(d);save();ui.paste=false;ui.tab='today';render();toast('Záloha obnovená ✓');
}

    const isNew=e.isNew;delete e.isNew;
    if(isNew){e.createdAt=dkey(today());e.archived=false;S.habits.push(e)}else{const i=S.habits.findIndex(x=>x.id===e.id);S.habits[i]=Object.assign(S.habits[i],e)}
    save();ui.edit=null;render();toast(isNew?'Zvyk pridaný ✓':'Uložené ✓');
  },
  del(t){const h=byId(t.dataset.id);if(!confirm(`Naozaj vymazať „${h.name}“ aj s celou históriou? Toto sa nedá vrátiť. (Ak ho chceš len skryť, použi Archivovať.)`))return;S.habits=S.habits.filter(x=>x.id!==h.id);for(const k in S.log){delete S.log[k][h.id];if(!Object.keys(S.log[k]).length)delete S.log[k]}save();ui.edit=null;ui.detail=null;render();toast('Zvyk vymazaný')},
  archive(t){byId(t.dataset.id).archived=true;save();ui.detail=null;render();toast('Archivované – nájdeš ho v záložke Zvyky')},
  unarchive(t){byId(t.dataset.id).archived=false;save();render();toast('Zvyk obnovený ✓')},
  up(t){move(t.dataset.id,-1)},down(t){move(t.dataset.id,1)},
  export(){download(`navyky-zaloha-${dkey(today())}.json`,backup(),'application/json');toast('Záloha stiahnutá')},
  copy(){const b=backup();(navigator.clipboard?navigator.clipboard.writeText(b):Promise.reject()).then(()=>toast('Záloha skopírovaná – vlož ju napr. do Poznámok'),()=>{ui.paste=true;render();const p=$('#paste');p.value=b;p.select();toast('Skopíruj text ručne')})},
  import(){$('#file').click()},
  pastetoggle(){ui.paste=!ui.paste;render()},
  pasteimport(){restore($('#paste').value)},
  reset(){if(confirm('Vymazať všetky zvyky, históriu a poznámky? Najprv si radšej sprav zálohu.')&&confirm('Naozaj? Toto sa nedá vrátiť.')){localStorage.removeItem(KEY);S=null;ui={tab:'today',day:dkey(today()),detail:null,cal:null,edit:null,paste:false};render()}},
  ics(t){
    const h=byId(t.dataset.id);if(!h.reminder){toast('Najprv nastav čas pripomienky');return}
    const d=today(),[hh,mm]=h.reminder.split(':'),now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
    const rule=h.schedule.kind==='weekdays'?'FREQ=WEEKLY;BYDAY='+h.schedule.days.map(x=>['MO','TU','WE','TH','FR','SA','SU'][x-1]).join(','):'FREQ=DAILY';
    const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Navyky//SK','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+h.id+'@navyky','DTSTAMP:'+now,`DTSTART:${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${hh}${mm}00`,'DURATION:PT10M','RRULE:'+rule,'SUMMARY:'+h.emoji+' '+h.name,'DESCRIPTION:Pripomienka z appky Návyky','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+h.name,'TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
    const a=document.createElement('a');a.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);a.download=h.name.replace(/[^\w\-]+/g,'_')+'.ics';document.body.appendChild(a);a.click();a.remove();
  }
};
function move(id,dir){const act=active();const i=act.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=act.length)return;const a=S.habits.indexOf(act[i]),b=S.habits.indexOf(act[j]);[S.habits[a],S.habits[b]]=[S.habits[b],S.habits[a]];save();render()}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=actions[t.dataset.a];if(f){e.preventDefault();f(t)}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='note'){if(t.value.trim())S.notes[ui.day]=t.value;else delete S.notes[ui.day];save();return}
  if(t.dataset.f&&ui.edit){ui.edit[t.dataset.f]=t.value;if(t.dataset.f==='emoji'){const ic=document.querySelector('[data-p="edit"] .ic');if(ic)ic.textContent=t.value}}
});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;f.text().then(restore);e.target.value=''});
setInterval(()=>{const tk=dkey(today());if(tk!==lastToday){if(ui.day===lastToday)ui.day=tk;lastToday=tk}const a=document.activeElement;if(!ui.edit&&!(a&&/TEXTAREA|INPUT/.test(a.tagName)))render()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const tk=dkey(today());if(tk!==lastToday){if(ui.day===lastToday)ui.day=tk;lastToday=tk}if(!ui.edit)render()}});
render();
</script>
</body>
</html>
